<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <meta name="description" content="Explore LLM4Robot-Bench, a hierarchical, matched sim–real benchmark for evaluating GPT-6 Astra in robotic manipulation.">
  <link rel="canonical" href="https://llm4robot.github.io/">
  <title>LLM4Robot</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #f5f6f2; color: #172d34; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { padding: 64px 24px; text-align: center; width: 100%; }
    h1 { margin: 0; font-size: clamp(40px, 6vw, 72px); line-height: 1.15; font-weight: 650; letter-spacing: -0.045em; }
    .project { max-width: 620px; margin: 44px auto 0; padding: 36px; background: #fff; border: 1px solid #dfe5df; border-radius: 20px; box-shadow: 0 12px 40px #172d3405; }
    .eyebrow { margin: 0 0 14px; color: #566c63; font-size: 11px; line-height: 1.5; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; }
    h2 { margin: 0; font-size: clamp(24px, 4.5vw, 30px); line-height: 1.25; font-weight: 650; letter-spacing: -.03em; }
    .description { max-width: 460px; margin: 16px auto 26px; color: #56676b; font-size: 16px; line-height: 1.7; text-wrap: pretty; }
    .project-link { display: inline-flex; justify-content: center; align-items: center; gap: 14px; min-height: 48px; padding: 12px 22px; border: 1px solid #172d34; border-radius: 999px; background: #172d34; color: #fff; font-size: 15px; font-weight: 550; text-decoration: none; transition: background .18s ease, transform .18s ease; }
    .project-link:hover { background: #2c4a4f; transform: translateY(-2px); }
    .project-link:focus-visible { outline: 3px solid #597f75; outline-offset: 5px; }
    .project-link svg { width: 18px; height: 18px; flex: none; }
    @media (max-width: 480px) { main { padding: 48px 20px; } .project { margin-top: 32px; padding: 28px 22px; border-radius: 16px; } }
    @media (prefers-reduced-motion: reduce) { .project-link { transition: none; } .project-link:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <h1>LLM4Robot</h1>
    <section class="project" aria-labelledby="bench-title">
      <p class="eyebrow">Robotic manipulation benchmark</p>
      <h2 id="bench-title">LLM4Robot-Bench</h2>
      <p class="description">A hierarchical, matched sim–real benchmark for evaluating GPT-6 Astra in robotic manipulation.</p>
      <a class="project-link" href="/bench/" aria-label="Explore the LLM4Robot-Bench project website">Explore the benchmark <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
    </section>
  </main>
</body>
</html>
